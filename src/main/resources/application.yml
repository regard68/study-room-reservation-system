server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie

spring:
  application:
    name: study-room-reservation-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/study_room_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  thymeleaf:
    cache: false
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:sql/cloud-schema.sql
      encoding: UTF-8

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.studyroom.mapper: debug
