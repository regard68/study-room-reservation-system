<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自习室管理</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/common :: topbar}"></div><div class="layout"><aside th:replace="~{fragments/common :: adminSidebar}"></aside><main class="content">
<div class="page-title"><div><h2>自习室管理</h2><p>维护自习室基础信息和开放状态。</p></div></div><div th:replace="~{fragments/common :: messages}"></div>
<div class="split"><section class="card"><h3 th:text="${roomForm.id == null} ? '新增自习室' : '修改自习室'"></h3><form th:action="@{/admin/rooms/save}" method="post" th:object="${roomForm}"><input type="hidden" th:field="*{id}"><div class="form-group"><label>自习室编号</label><input th:field="*{roomNo}" required placeholder="如 SR-004"></div><div class="form-group"><label>自习室名称</label><input th:field="*{roomName}" required></div><div class="form-group"><label>位置</label><input th:field="*{location}" required></div><div class="form-group"><label>开放时间</label><input th:field="*{openTime}" required placeholder="08:00-22:00"></div><div class="form-group"><label>状态</label><select th:field="*{status}"><option value="OPEN">开放</option><option value="CLOSED">关闭</option></select></div><button class="btn btn-primary" type="submit">保存</button> <a class="btn btn-secondary" th:href="@{/admin/rooms}">清空</a></form></section>
<section class="card table-wrap"><h3>自习室列表</h3><table><thead><tr><th>编号</th><th>名称</th><th>位置</th><th>开放时间</th><th>座位</th><th>状态</th><th>操作</th></tr></thead><tbody><tr th:each="room:${rooms}"><td th:text="${room.roomNo}"></td><td th:text="${room.roomName}"></td><td th:text="${room.location}"></td><td th:text="${room.openTime}"></td><td th:text="${room.seatCount}"></td><td><span class="badge" th:classappend="${room.status == 'OPEN'} ? 'badge-open' : 'badge-closed'" th:text="${room.status == 'OPEN'} ? '开放' : '关闭'"></span></td><td><a class="btn btn-secondary btn-sm" th:href="@{/admin/rooms(editId=${room.id})}">编辑</a> <a class="btn btn-secondary btn-sm" th:href="@{/admin/seats(roomId=${room.id})}">座位</a> <form class="inline" th:action="@{/admin/rooms/{id}/delete(id=${room.id})}" method="post" onsubmit="return confirm('删除自习室会同时删除未被预约的座位，确定继续吗？')"><button class="btn btn-danger btn-sm">删除</button></form></td></tr></tbody></table></section></div>
</main></div></body></html>
