<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/common :: topbar}"></div><div class="layout"><aside th:replace="~{fragments/common :: adminSidebar}"></aside><main class="content">
<div class="page-title"><div><h2>用户管理</h2><p>查看已注册学生，处理异常账号。</p></div></div><div th:replace="~{fragments/common :: messages}"></div>
<div class="card table-wrap"><table><thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>注册时间</th><th>操作</th></tr></thead><tbody><tr th:each="user:${users}"><td th:text="${user.id}"></td><td th:text="${user.username}"></td><td><span class="badge badge-open">学生</span></td><td th:text="${#temporals.format(user.createTime,'yyyy-MM-dd HH:mm')}"></td><td><form class="inline" th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" onsubmit="return confirm('确定删除该学生吗？')"><button class="btn btn-danger btn-sm">删除</button></form></td></tr></tbody></table><div class="empty" th:if="${#lists.isEmpty(users)}">暂无学生用户</div></div>
</main></div></body></html>
