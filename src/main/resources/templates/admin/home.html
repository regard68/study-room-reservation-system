<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/common :: topbar}"></div><div class="layout"><aside th:replace="~{fragments/common :: adminSidebar}"></aside><main class="content">
<div class="page-title"><div><h2>管理后台</h2><p>共享自习室预约系统运行数据概览。</p></div></div><div th:replace="~{fragments/common :: messages}"></div>
<section class="stats"><div class="stat"><div class="label">学生用户</div><div class="number" th:text="${userCount}"></div><a th:href="@{/admin/users}">查看用户</a></div><div class="stat"><div class="label">自习室</div><div class="number" th:text="${roomCount}"></div><a th:href="@{/admin/rooms}">管理自习室</a></div><div class="stat"><div class="label">座位总数</div><div class="number" th:text="${seatCount}"></div><a th:href="@{/admin/seats}">管理座位</a></div><div class="stat"><div class="label">预约记录</div><div class="number" th:text="${reservationCount}"></div><a th:href="@{/admin/reservations}">查看预约</a></div></section>
<div class="card table-wrap"><h3>最近预约记录</h3><table><thead><tr><th>预约姓名</th><th>登录账号</th><th>自习室</th><th>座位</th><th>日期</th><th>时间段</th><th>状态</th></tr></thead><tbody><tr th:each="item,stat:${recentReservations}" th:if="${stat.index < 8}"><td th:text="${item.reservationName}"></td><td th:text="${item.username}"></td><td th:text="${item.roomName}"></td><td th:text="${item.seatNo}"></td><td th:text="${item.reserveDate}"></td><td th:text="${item.timeSlot}"></td><td><span class="badge" th:classappend="${item.status == 'RESERVED'} ? 'badge-reserved' : 'badge-cancelled'" th:text="${item.status == 'RESERVED'} ? '已预约' : '已取消'"></span></td></tr></tbody></table><div class="empty" th:if="${#lists.isEmpty(recentReservations)}">暂无预约记录</div></div>
</main></div></body></html>
