<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公告管理</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/common :: topbar}"></div><div class="layout"><aside th:replace="~{fragments/common :: adminSidebar}"></aside><main class="content">
<div class="page-title"><div><h2>公告管理</h2><p>发布和维护学生端展示的系统通知。</p></div></div><div th:replace="~{fragments/common :: messages}"></div>
<div class="split"><section class="card"><h3 th:text="${noticeForm.id == null} ? '发布公告' : '修改公告'"></h3><form th:action="@{/admin/notices/save}" method="post" th:object="${noticeForm}"><input type="hidden" th:field="*{id}"><div class="form-group"><label>公告标题</label><input th:field="*{title}" required maxlength="150"></div><div class="form-group"><label>公告内容</label><textarea th:field="*{content}" required></textarea></div><button class="btn btn-primary">保存公告</button> <a class="btn btn-secondary" th:href="@{/admin/notices}">清空</a></form></section>
<section class="card"><h3>公告列表</h3><article class="notice" th:each="notice:${notices}"><h3 th:text="${notice.title}"></h3><time th:text="${#temporals.format(notice.createTime,'yyyy-MM-dd HH:mm')}"></time><p th:text="${notice.content}"></p><a class="btn btn-secondary btn-sm" th:href="@{/admin/notices(editId=${notice.id})}">编辑</a> <form class="inline" th:action="@{/admin/notices/{id}/delete(id=${notice.id})}" method="post" onsubmit="return confirm('确定删除该公告吗？')"><button class="btn btn-danger btn-sm">删除</button></form></article><div class="empty" th:if="${#lists.isEmpty(notices)}">暂无公告</div></section></div>
</main></div></body></html>
