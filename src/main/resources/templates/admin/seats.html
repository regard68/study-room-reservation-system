<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>座位管理</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/common :: topbar}"></div><div class="layout"><aside th:replace="~{fragments/common :: adminSidebar}"></aside><main class="content">
<div class="page-title"><div><h2>座位管理</h2><p>按自习室添加座位并维护座位状态。</p></div></div><div th:replace="~{fragments/common :: messages}"></div>
<div class="card"><form class="filter" method="get" th:action="@{/admin/seats}"><div class="form-group"><label>筛选自习室</label><select name="roomId"><option value="">全部自习室</option><option th:each="room:${rooms}" th:value="${room.id}" th:text="${room.roomName}" th:selected="${room.id == selectedRoomId}"></option></select></div><button class="btn btn-primary" type="submit">查询</button></form></div>
<div class="split"><section class="card"><h3 th:text="${seatForm.id == null} ? '新增座位' : '修改座位'"></h3><form th:action="@{/admin/seats/save}" method="post" th:object="${seatForm}"><input type="hidden" th:field="*{id}"><div class="form-group"><label>所属自习室</label><select th:field="*{roomId}" required><option value="">请选择</option><option th:each="room:${rooms}" th:value="${room.id}" th:text="${room.roomName}"></option></select></div><div class="form-group"><label>座位号</label><input th:field="*{seatNo}" required placeholder="如 A01"></div><div class="form-group"><label>座位状态</label><select th:field="*{status}"><option value="AVAILABLE">可用</option><option value="MAINTENANCE">维护中</option></select></div><button class="btn btn-primary">保存</button> <a class="btn btn-secondary" th:href="@{/admin/seats(roomId=${selectedRoomId})}">清空</a></form></section>
<section class="card table-wrap"><h3>座位列表</h3><table><thead><tr><th>自习室</th><th>座位号</th><th>状态</th><th>添加时间</th><th>操作</th></tr></thead><tbody><tr th:each="seat:${seats}"><td th:text="${seat.roomName}"></td><td th:text="${seat.seatNo}"></td><td><span class="badge" th:classappend="${seat.status == 'AVAILABLE'} ? 'badge-available' : 'badge-maintenance'" th:text="${seat.status == 'AVAILABLE'} ? '可用' : '维护中'"></span></td><td th:text="${#temporals.format(seat.createTime,'yyyy-MM-dd HH:mm')}"></td><td><a class="btn btn-secondary btn-sm" th:href="@{/admin/seats(roomId=${seat.roomId},editId=${seat.id})}">编辑</a> <form class="inline" th:action="@{/admin/seats/{id}/delete(id=${seat.id})}" method="post" onsubmit="return confirm('确定删除该座位吗？')"><input type="hidden" name="roomId" th:value="${seat.roomId}"><button class="btn btn-danger btn-sm">删除</button></form></td></tr></tbody></table><div class="empty" th:if="${#lists.isEmpty(seats)}">暂无座位</div></section></div>
</main></div></body></html>
