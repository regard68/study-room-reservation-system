<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>预约管理</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/common :: topbar}"></div><div class="layout"><aside th:replace="~{fragments/common :: adminSidebar}"></aside><main class="content">
<div class="page-title"><div><h2>预约管理</h2><p>查询所有学生的预约记录，取消违规预约。</p></div></div><div th:replace="~{fragments/common :: messages}"></div>
<div class="card"><form class="filter" method="get" th:action="@{/admin/reservations}"><div class="form-group"><label>预约姓名或账号</label><input name="username" th:value="${username}" placeholder="模糊查询"></div><div class="form-group"><label>自习室</label><select name="roomId"><option value="">全部</option><option th:each="room:${rooms}" th:value="${room.id}" th:text="${room.roomName}" th:selected="${room.id == roomId}"></option></select></div><div class="form-group"><label>预约日期</label><input type="date" name="reserveDate" th:value="${reserveDate}"></div><div class="form-group"><label>状态</label><select name="status"><option value="">全部</option><option value="RESERVED" th:selected="${status == 'RESERVED'}">已预约</option><option value="CANCELLED" th:selected="${status == 'CANCELLED'}">已取消</option></select></div><div><button class="btn btn-primary">查询</button> <a class="btn btn-secondary" th:href="@{/admin/reservations}">重置</a></div></form></div>
<div class="card table-wrap"><table><thead><tr><th>预约姓名</th><th>登录账号</th><th>自习室</th><th>座位号</th><th>日期</th><th>时间段</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead><tbody><tr th:each="item:${reservations}"><td th:text="${item.reservationName}"></td><td th:text="${item.username}"></td><td th:text="${item.roomName}"></td><td th:text="${item.seatNo}"></td><td th:text="${item.reserveDate}"></td><td th:text="${item.timeSlot}"></td><td><span class="badge" th:classappend="${item.status == 'RESERVED'} ? 'badge-reserved' : 'badge-cancelled'" th:text="${item.status == 'RESERVED'} ? '已预约' : '已取消'"></span></td><td th:text="${#temporals.format(item.createTime,'yyyy-MM-dd HH:mm')}"></td><td><form th:if="${item.status == 'RESERVED'}" th:action="@{/admin/reservations/{id}/cancel(id=${item.id})}" method="post" onsubmit="return confirm('确定取消该预约吗？')"><button class="btn btn-danger btn-sm">取消</button></form><span class="muted" th:unless="${item.status == 'RESERVED'}">已处理</span></td></tr></tbody></table><div class="empty" th:if="${#lists.isEmpty(reservations)}">没有符合条件的记录</div></div>
</main></div></body></html>
