<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的预约</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/common :: topbar}"></div><div class="layout"><aside th:replace="~{fragments/common :: studentSidebar}"></aside><main class="content">
<div class="page-title"><div><h2>我的预约</h2><p>查看和管理个人座位预约记录。</p></div><a class="btn btn-primary" th:href="@{/student/rooms}">新增预约</a></div><div th:replace="~{fragments/common :: messages}"></div>
<div class="card table-wrap"><table><thead><tr><th>预约姓名</th><th>自习室</th><th>座位号</th><th>预约日期</th><th>时间段</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody><tr th:each="item:${reservations}"><td th:text="${item.reservationName}"></td><td th:text="${item.roomName}"></td><td th:text="${item.seatNo}"></td><td th:text="${item.reserveDate}"></td><td th:text="${item.timeSlot}"></td><td><span class="badge" th:classappend="${item.status == 'RESERVED'} ? 'badge-reserved' : 'badge-cancelled'" th:text="${item.status == 'RESERVED'} ? '已预约' : '已取消'"></span></td><td th:text="${#temporals.format(item.createTime,'yyyy-MM-dd HH:mm')}"></td><td><form class="inline" th:if="${item.status == 'RESERVED' and !item.reserveDate.isBefore(today)}" th:action="@{/student/reservations/{id}/cancel(id=${item.id})}" method="post" onsubmit="return confirm('确定取消该预约吗？')"><button class="btn btn-danger btn-sm">取消预约</button></form><span class="muted" th:unless="${item.status == 'RESERVED' and !item.reserveDate.isBefore(today)}">不可操作</span></td></tr></tbody></table><div class="empty" th:if="${#lists.isEmpty(reservations)}">暂无预约记录</div></div>
</main></div></body></html>
