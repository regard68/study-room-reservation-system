<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>座位预约</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/common :: topbar}"></div><div class="layout"><aside th:replace="~{fragments/common :: studentSidebar}"></aside><main class="content">
<div class="page-title"><div><h2 th:text="${room.roomName} + ' - 座位预约'"></h2><p><span th:text="${room.location}"></span> · <span th:text="${room.openTime}"></span></p></div><a class="btn btn-secondary" th:href="@{/student/rooms}">返回列表</a></div><div th:replace="~{fragments/common :: messages}"></div>
<div class="card"><h3>选择可用座位</h3><p class="muted">填写预约人姓名，再选择日期和时间段。同一姓名在同一时间段只能预约一个座位。</p><div class="seat-grid"><div th:each="seat:${seats}" class="seat" th:classappend="${seat.status == 'AVAILABLE'} ? 'available' : 'disabled'"><strong th:text="${seat.seatNo}"></strong><span th:if="${seat.status != 'AVAILABLE'}" class="badge badge-maintenance">维护中</span><form class="seat-form" th:if="${seat.status == 'AVAILABLE'}" th:action="@{/student/reserve}" method="post"><input type="hidden" name="roomId" th:value="${room.id}"><input type="hidden" name="seatId" th:value="${seat.id}"><div class="modal-form"><label class="compact-field"><span>预约人姓名</span><input type="text" name="reservationName" maxlength="50" placeholder="请输入姓名" autocomplete="name" required></label><label class="compact-field"><span>预约日期</span><input type="date" name="reserveDate" th:min="${today}" required></label><label class="compact-field"><span>时间段</span><select name="timeSlot" required><option value="08:00-10:00">08:00-10:00</option><option value="10:00-12:00">10:00-12:00</option><option value="14:00-16:00">14:00-16:00</option><option value="16:00-18:00">16:00-18:00</option><option value="19:00-21:00">19:00-21:00</option></select></label></div><button class="btn btn-primary btn-sm" type="submit" style="margin-top:10px;width:100%">预约</button></form></div></div><div class="empty" th:if="${#lists.isEmpty(seats)}">该自习室尚未配置座位</div></div>
</main></div></body></html>
